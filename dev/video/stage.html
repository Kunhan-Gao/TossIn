<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TossIn demo video stage</title>
<link rel="stylesheet" href="stage.css">
</head>
<body>
<!-- 演示视频的"舞台"：把真实的看板界面嵌在中间，四周是字幕、鼠标指针、按键提示和几段单独画的动画。
     每一帧的样子都只由"第几帧"决定，由 dev/video/record.js 逐帧截图。 -->
<div id="stage">
  <div id="hook">
    <div id="questions"></div>
    <div id="title"><small></small><b></b><span></span></div>
    <div class="scrap" id="s-shot"><small></small><img alt=""></div>
    <div class="scrap" id="s-note"><small></small><code></code></div>
    <div class="scrap" id="s-tabs"><div class="tabs"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><small></small></div>
    <svg id="bird" viewBox="0 0 64 36">
      <path class="water" d="M2 31H62"/>
      <path class="bd" d="M7.5 25 C6.5 17.5 16 13.2 26.5 15 C34 16.4 37.6 22.5 36.6 30 L12 30 C9.3 29.4 7.8 27.6 7.5 25 Z"/>
      <path class="nk" d="M31.5 22 C32.8 18.5 31.8 15.5 33 12"/>
      <circle class="bd" cx="33.6" cy="9.4" r="5.7"/>
      <path class="bd bill" d="M37 5.9 L55.4 13.6 Q57 14.6 56.1 16.4 L37.6 12.7 Z"/>
      <path class="pc" d="M37.8 12.5 L56 16.2 C53.4 22.6 47.4 25.6 42.8 23.8 C39.8 22.6 38 20 37.5 16.8 Z"/>
      <circle class="ey" cx="35.2" cy="8.2" r="1.1"/>
    </svg>
  </div>

  <div id="captions"></div>
  <div id="days"></div>
  <div id="keys"></div>

  <div id="desk">
    <div id="other" class="win">
      <div class="bar"><i></i><i></i><i></i><span></span></div>
      <div class="note"></div>
      <div class="memo">
        <p><span class="said"></span><span class="pasted"></span></p>
        <p><span class="said2"></span></p>
        <div class="slot"><img alt=""></div>
      </div>
    </div>
    <div id="boardwin" class="win"><iframe id="app" tabindex="-1"></iframe></div>
    <div id="peek">
      <svg viewBox="17 1 42 27.5" preserveAspectRatio="xMinYMid meet">
        <path class="bd" d="M7.5 25 C6.5 17.5 16 13.2 26.5 15 C34 16.4 37.6 22.5 36.6 30 L12 30 C9.3 29.4 7.8 27.6 7.5 25 Z"/>
        <path class="nk" d="M31.5 22 C32.8 18.5 31.8 15.5 33 12"/>
        <circle class="bd" cx="33.6" cy="9.4" r="5.7"/>
        <path class="bd bill" d="M37 5.9 L55.4 13.6 Q57 14.6 56.1 16.4 L37.6 12.7 Z"/>
        <path class="pc" d="M37.8 12.5 L56 16.2 C53.4 22.6 47.4 25.6 42.8 23.8 C39.8 22.6 38 20 37.5 16.8 Z"/>
        <circle class="ey" cx="35.2" cy="8.2" r="1.1"/>
      </svg>
    </div>
  </div>

  <div id="end">
    <img id="end-icon" alt="">
    <div id="end-name"></div>
    <div id="end-sub"></div>
    <div id="end-tags"></div>
    <div id="end-where"></div>
  </div>

  <div id="glow"></div>
  <div id="ghost"></div>
  <div id="ring"></div>
  <svg id="cursor" viewBox="0 0 24 24"><path d="M5 2.5v17l4.4-4.1 2.9 6.6 2.7-1.2-2.9-6.5h6.1z"/></svg>
</div>
<script src="stage.js"></script>
</body>
</html>
