<!doctype html>
<meta charset="utf-8">
<script>
// 把一个文件夹里按顺序编号的帧（f0000.jpg…）编码成 H.264，封装成 mp4。
// 编完以后再解码一遍，数一数帧数，并把指定的几帧存成图片，用来核对成片。
const fs = require('fs');
const path = require('path');
const { Muxer, ArrayBufferTarget } = require('mp4-muxer');
const { ipcRenderer } = require('electron');

const arg = (name, fallback) => {
  const hit = process.argv.find((a) => a.startsWith(`--${name}=`));
  return hit ? hit.slice(name.length + 3) : fallback;
};
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

(async () => {
  const out = {};
  try {
    const dir = arg('frames');
    const file = arg('out');
    const fps = Number(arg('fps', 30));
    const bitrate = Number(arg('bitrate', 6e6));
    const checks = arg('check', '').split(',').filter(Boolean).map(Number); // 要存下来核对的帧号
    const audioFile = arg('audio', ''); // 16 位立体声的 WAV；不给就是无声的
    const files = fs.readdirSync(dir).filter((f) => /^f\d+\.jpg$/.test(f)).sort();
    const load = (f) => createImageBitmap(new Blob([fs.readFileSync(path.join(dir, f))], { type: 'image/jpeg' }));
    const first = await load(files[0]);
    const W = first.width, H = first.height;
    first.close();

    const chunks = [];
    let decoderConfig = null;
    // 声音：读 WAV，拆成左右两路
    let pcm = null;
    if (audioFile) {
      const wav = fs.readFileSync(audioFile);
      const dataAt = wav.indexOf('data', 12) + 8;
      const rate = wav.readUInt32LE(24);
      const n = Math.floor((wav.length - dataAt) / 4);
      pcm = { rate, n, left: new Float32Array(n), right: new Float32Array(n) };
      for (let i = 0; i < n; i++) { pcm.left[i] = wav.readInt16LE(dataAt + i * 4) / 32768; pcm.right[i] = wav.readInt16LE(dataAt + i * 4 + 2) / 32768; }
    }
    const muxer = new Muxer({
      target: new ArrayBufferTarget(), fastStart: 'in-memory',
      video: { codec: 'avc', width: W, height: H, frameRate: fps },
      ...(pcm ? { audio: { codec: 'aac', numberOfChannels: 2, sampleRate: pcm.rate } } : {}),
    });
    const encoder = new VideoEncoder({
      output: (chunk, meta) => {
        muxer.addVideoChunk(chunk, meta);
        if (meta && meta.decoderConfig) decoderConfig = meta.decoderConfig;
        const data = new Uint8Array(chunk.byteLength);
        chunk.copyTo(data);
        chunks.push({ type: chunk.type, timestamp: chunk.timestamp, duration: chunk.duration, data });
      },
      error: (e) => { out.encoderError = String(e); },
    });
    encoder.configure({ codec: 'avc1.640028', width: W, height: H, bitrate, framerate: fps, bitrateMode: 'variable', latencyMode: 'quality' });
    for (let i = 0; i < files.length; i++) {
      const bitmap = await load(files[i]);
      const frame = new VideoFrame(bitmap, { timestamp: Math.round(i * 1e6 / fps), duration: Math.round(1e6 / fps) });
      encoder.encode(frame, { keyFrame: i % (fps * 2) === 0 });
      frame.close();
      bitmap.close();
      while (encoder.encodeQueueSize > 6) await sleep(4);
    }
    await encoder.flush();
    if (pcm) {
      const aenc = new AudioEncoder({ output: (chunk, meta) => muxer.addAudioChunk(chunk, meta), error: (e) => { out.audioError = String(e); } });
      aenc.configure({ codec: 'mp4a.40.2', sampleRate: pcm.rate, numberOfChannels: 2, bitrate: 160000 });
      const step = 4800;
      for (let p = 0; p < pcm.n; p += step) {
        const len = Math.min(step, pcm.n - p);
        const data = new Float32Array(len * 2);
        data.set(pcm.left.subarray(p, p + len), 0);
        data.set(pcm.right.subarray(p, p + len), len);
        const chunk = new AudioData({ format: 'f32-planar', sampleRate: pcm.rate, numberOfFrames: len, numberOfChannels: 2, timestamp: Math.round(p * 1e6 / pcm.rate), data });
        aenc.encode(chunk);
        chunk.close();
      }
      await aenc.flush();
    }
    muxer.finalize();
    fs.writeFileSync(file, Buffer.from(muxer.target.buffer));
    Object.assign(out, { file, width: W, height: H, frames: files.length, seconds: files.length / fps, megabytes: +(muxer.target.buffer.byteLength / 1048576).toFixed(2) });

    // 核对一：编出来的码流能不能完整解回来
    let decoded = 0;
    const canvas = new OffscreenCanvas(W, H);
    const ctx = canvas.getContext('2d');
    const saved = [];
    const decoder = new VideoDecoder({
      output: (frame) => {
        const index = Math.round(frame.timestamp * fps / 1e6);
        if (checks.includes(index)) { ctx.drawImage(frame, 0, 0); saved.push(canvas.convertToBlob({ type: 'image/png' }).then(async (b) => fs.writeFileSync(file.replace(/\.mp4$/, `-check${String(index).padStart(4, '0')}.png`), Buffer.from(await b.arrayBuffer())))); }
        decoded++;
        frame.close();
      },
      error: (e) => { out.decoderError = String(e); },
    });
    decoder.configure(decoderConfig);
    for (const c of chunks) {
      decoder.decode(new EncodedVideoChunk(c));
      while (decoder.decodeQueueSize > 6) await sleep(4);
    }
    await decoder.flush();
    await Promise.all(saved);
    out.decodedFrames = decoded;

    // 核对二：文件本身能不能当视频打开，时长和尺寸对不对
    const video = document.createElement('video');
    video.muted = true;
    video.src = 'file:///' + file.replace(/\\/g, '/');
    await new Promise((res, rej) => { video.onloadeddata = res; video.onerror = () => rej(new Error('成片打不开')); });
    out.playback = { seconds: +video.duration.toFixed(3), width: video.videoWidth, height: video.videoHeight };

    // 核对三：成片里的声音。把它解出来，和原来的 WAV 比一比：多长、多响、有没有错位
    if (pcm) {
      const decoded = await new AudioContext({ sampleRate: pcm.rate }).decodeAudioData(fs.readFileSync(file).buffer.slice(0));
      const got = decoded.getChannelData(0);
      const onset = (d) => { for (let i = 0; i < d.length; i++) if (Math.abs(d[i]) > 0.02) return i; return -1; };
      let peak = 0; for (let i = 0; i < got.length; i++) peak = Math.max(peak, Math.abs(got[i]));
      // 找出"咕咚"那一下（5.3 到 5.9 秒之间最响的一点）在成片和原声里各在什么位置
      const loudest = (d, a, b) => { let at = a, m = 0; for (let i = a; i < b && i < d.length; i++) if (Math.abs(d[i]) > m) { m = Math.abs(d[i]); at = i; } return at; };
      const a = Math.round(5.3 * pcm.rate), b = Math.round(5.9 * pcm.rate);
      out.audio = {
        seconds: +decoded.duration.toFixed(3), channels: decoded.numberOfChannels, peak: +peak.toFixed(3),
        firstSoundShiftMs: +(((onset(got) - onset(pcm.left)) / pcm.rate) * 1000).toFixed(1),
        gulpShiftMs: +(((loudest(got, a, b) - loudest(pcm.left, a, b)) / pcm.rate) * 1000).toFixed(1),
      };
    }
  } catch (err) {
    out.error = String((err && err.stack) || err);
  }
  ipcRenderer.send('done', out);
})();
</script>
